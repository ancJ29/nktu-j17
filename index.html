<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="%VITE_APP_THEME_COLOR%" />
    <link
      rel="apple-touch-startup-image"

      rel="apple-touch-startup-image"

    />
    <link
      rel="apple-touch-startup-image"

      rel="apple-touch-startup-image"

    <link
      rel="apple-touch-startup-image"
      href="/apple-splash-1668-2224.png"
      media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

      rel="apple-touch-startup-image"
      href="/apple-splash-1620-2160.png"

    />
    <meta name="theme-color" content="%VITE_APP_THEME_COLOR%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <meta name="screen-orientation" content="portrait" />
    <meta name="msapplication-TileColor" content="%VITE_APP_THEME_COLOR%" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">

      rel="stylesheet">

    <style>
      html, body { background-color: %VITE_APP_BG_COLOR%; }
    </style>

    <script>
      // localStorage.setItem('CREDO_GROUP', 'VITE_CREDO_GROUP');
    </script>
  </head>

  <body>
         On first boot (no cache), this covers the theme flash during backend config fetch + reload. -->
    <div id="app-loading" style="
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #fafafa;
    ">
      <div style="text-align: center;">
        <div style="
          width: 36px; height: 36px; margin: 0 auto 12px;
          border: 3px solid #e5e5e5; border-top-color: #9ca3af;
          border-radius: 50%; animation: app-spin 0.7s linear infinite;
        "></div>
        <div style="font-family: Inter, sans-serif; font-size: 13px; color: #9ca3af;">Loading</div>
      </div>
      <style>@keyframes app-spin { to { transform: rotate(360deg); } }</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
