<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#212529"/>

  <!-- Clipboard body -->
  <rect x="8" y="9" width="16" height="18" rx="2" fill="#f1f3f5" opacity="0.95"/>

  <!-- Clipboard clip -->
  <rect x="12" y="6" width="8" height="5" rx="1.5" fill="#1a1d21"/>
  <rect x="13.5" y="7.5" width="5" height="2" rx="1" fill="#f1f3f5"/>

  <!-- Checklist lines -->
  <!-- Row 1: checked -->
  <rect x="11" y="14" width="2.5" height="2.5" rx="0.5" fill="#212529"/>
  <path d="M11.3 15.4 L12 16 L13.2 14.5" stroke="#f1f3f5" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="15" y="14.5" width="6.5" height="1.5" rx="0.75" fill="#343a40" opacity="0.5"/>

  <!-- Row 2: checked -->
  <rect x="11" y="18" width="2.5" height="2.5" rx="0.5" fill="#212529"/>
  <path d="M11.3 19.4 L12 20 L13.2 18.5" stroke="#f1f3f5" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="15" y="18.5" width="5" height="1.5" rx="0.75" fill="#343a40" opacity="0.5"/>

  <!-- Row 3: unchecked -->
  <rect x="11" y="22" width="2.5" height="2.5" rx="0.5" stroke="#212529" stroke-width="0.6" fill="none"/>
  <rect x="15" y="22.5" width="7" height="1.5" rx="0.75" fill="#343a40" opacity="0.3"/>
</svg>